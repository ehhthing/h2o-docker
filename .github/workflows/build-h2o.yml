name: Build and publish H2O

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the upstream commit has already been published
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: h2o-ghcr-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      image: ${{ steps.upstream.outputs.image }}
      needed: ${{ steps.check.outputs.needed }}

    steps:
      - name: Resolve upstream commit and image name
        id: upstream
        run: |
          sha="$(git ls-remote https://github.com/h2o/h2o.git HEAD | cut -f1)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the h2o/h2o default-branch commit" >&2
            exit 1
          fi
          printf 'sha=%s\nimage=ghcr.io/%s\n' "$sha" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the commit is already published
        id: check
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          SHA: ${{ steps.upstream.outputs.sha }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild requested."
          elif manifest="$(docker buildx imagetools inspect --raw "$IMAGE:sha-$SHA" 2>&1)" &&
               jq -e '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | contains(["linux/amd64", "linux/arm64"])' <<< "$manifest" > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already published for AMD64 and ARM64: \`$IMAGE:sha-$SHA\`. Skipping the build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            printf 'Commit tag is absent, missing a platform, or could not be read; attempting a build.\n%s\n' "$manifest"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out the Docker build files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          no-cache: ${{ inputs.force || false }}
          build-args: |
            H2O_COMMIT=${{ needs.prepare.outputs.sha }}
          tags: |
            ${{ needs.prepare.outputs.image }}:sha-${{ needs.prepare.outputs.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.url=https://github.com/h2o/h2o
          cache-from: type=gha,scope=h2o-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=h2o-${{ matrix.arch }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$SHA" \
            "$IMAGE:sha-$SHA-amd64" \
            "$IMAGE:sha-$SHA-arm64"

      - name: Summarize publication
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{json .Manifest}}' | jq -r '.digest')"
          {
            echo "Published \`$IMAGE:latest\` and \`$IMAGE:sha-$SHA\`."
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "Upstream commit: \`$SHA\`"
            echo "Image digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
